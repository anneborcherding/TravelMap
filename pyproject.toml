[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "travelmap"
version = "0.1.0"
description = "Generate editable travel-map posters from local itineraries"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1,<9", "typer>=0.15,<1", "fiona>=1.10,<2",
    "shapely>=2,<3", "osmium>=4,<5", "pyproj>=3.7,<4", "pydantic>=2.10,<3", "psutil>=7,<8",
]

[project.scripts]
travelmap = "travelmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/travelmap"]
